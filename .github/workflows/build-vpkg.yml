name: Build Vega package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install Vega SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq build-essential lz4 software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.8-dev

      - name: Install Vega SDK
        env:
          NONINTERACTIVE: 'true'
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o "$RUNNER_TEMP/get_vvm.sh"
          bash "$RUNNER_TEMP/get_vvm.sh"
          source "$HOME/vega/env"
          vega sdk install --non-interactive
          vega sdk config doctor
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: npm ci

      - name: Build release package
        run: npm run build

      - name: Verify package output
        run: |
          if ! find build -type f -name '*.vpkg' -print -quit | grep -q .; then
            echo "Vega build completed without producing a .vpkg file." >&2
            exit 1
          fi

      - name: Upload downloadable packages
        uses: actions/upload-artifact@v4
        with:
          name: mrbot-vega-vpkg
          path: build/**/*.vpkg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: mrbot-vega-vpkg
          path: packages

      - name: Publish packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' packages < <(find packages -type f -name '*.vpkg' -print0)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No .vpkg files were downloaded from the build job." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${packages[@]}" --generate-notes
